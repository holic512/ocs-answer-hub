# 仅用于本项目隔离的本地 PostgreSQL，不连接生产数据库。
name: ocs-answer-hub-local
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?请先运行 node scripts/setup-local.mjs 并填写 DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请先填写 DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:?请先填写 DB_NAME}
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    volumes:
      - local-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  local-postgres:
